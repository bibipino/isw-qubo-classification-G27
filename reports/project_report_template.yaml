design_choices:
  correlation_computation: "Absolute Spearman rank correlations were used to evaluate feature-target influence and feature-feature independence."
  QUBO_optimization_algorithm:
    algorithm_name: "Randomized Local Search (Hill Climbing)"
    library_used: "NumPy"
    reason_for_choice: "A vectorized NumPy implementation is cleaner, faster, and easier to maintain without external solver dependencies. It evaluates single bit flips efficiently and only accepts moves that strictly lower or maintain the cost."
  classification_algorithm:
    algorithm_name: "Random Forest, XGBoost, and K-Nearest Neighbors (KNN)"
    library_used: "scikit-learn and xgboost"
    reason_for_choice: "Random Forest was chosen to satisfy the mandatory project requirement, while XGBoost and KNN were retained to complete the required set of three classifiers."
  gui_development: "Streamlit was selected because it is the fastest technology for the assignment, produces a professional interface, is easy to demonstrate, and can integrate with the backend without changing the architecture."
  problems_encountered:
    - problem: "There were a lot of little problems to pretty much every section, with runtime errors, syntax errors and also a big error were we didn't comply to point 12/13 in a suficent way"
      solution: "The smaller ones were fixed with AI or manual fixes when they were spotted but the big one made so we had to start the project from scratch and redo it."
  notes:
    "The project didn't reach a big point before reset and since the reports were not done for those 2 days we decided to completely start like those days didn't occur since there were no traces of them"

